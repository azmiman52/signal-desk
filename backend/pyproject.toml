[project]
name = "signaldesk-api"
version = "0.1.0"
description = "SignalDesk application API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.0",
    "uvicorn==0.54.0",
    "asyncpg==0.31.0",
    "sqlalchemy[asyncio]==2.1.3",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "tzdata==2026.5",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a dedicated PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
