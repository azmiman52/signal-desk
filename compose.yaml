name: signaldesk-local

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: signaldesk
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signaldesk-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql://signaldesk:${POSTGRES_PASSWORD:-signaldesk-local-only}@db:5432/signaldesk
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-signaldesk-migrator-local-only}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-signaldesk-app-local-only}
    command: ["python", "/app/infra/migrate.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://signaldesk_app:${APP_DATABASE_PASSWORD:-signaldesk-app-local-only}@db:5432/signaldesk
      APP_ENV: development
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-100}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8080}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_COLLECTOR_TOKEN: ${GITHUB_COLLECTOR_TOKEN:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://127.0.0.1:8080/api/v1/auth/github/callback}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://signaldesk_app:${APP_DATABASE_PASSWORD:-signaldesk-app-local-only}@db:5432/signaldesk
      GITHUB_COLLECTOR_TOKEN: ${GITHUB_COLLECTOR_TOKEN:-}
    command: ["python", "-m", "signaldesk.worker"]
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
