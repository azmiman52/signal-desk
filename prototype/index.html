<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignalDesk · Interactive prototype</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e8edf5;background:#0b1019;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;border-bottom:1px solid #293345;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-size:24px;font-weight:750;letter-spacing:-1px}.brand span{color:#74e2c7}.demo{background:#2c253e;color:#e5cdfa;padding:7px 12px;border-radius:8px;font-size:13px}.shell{max-width:1120px;margin:auto;padding:28px 24px}.bar{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}nav{display:flex;gap:8px;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #41516a;border-radius:8px;padding:11px 14px}button{background:#1a2536;color:#e8edf5;cursor:pointer}button:hover{background:#2b3b52}button.primary,button[aria-current=page]{background:#80e6ca;color:#0d3027;border-color:#80e6ca;font-weight:650}button:disabled{opacity:.55;cursor:wait}input,select,textarea{background:#111a28;color:#f4f6fa;max-width:100%}input,textarea{width:100%;margin:8px 0 18px}textarea{min-height:80px}label{display:block;color:#c3cede;font-size:14px}h1{font-size:34px;letter-spacing:-1px;margin-bottom:8px}h2{font-size:19px}p{line-height:1.6}.muted,small{color:#a9b7ca}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.card{background:#131c2b;border:1px solid #2b374a;border-radius:14px;padding:24px;margin:18px 0}.grid .card{margin:0}.number{font-size:36px;font-weight:700;margin:14px 0 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.tag{font-size:13px;border-radius:6px;padding:5px 9px;background:#29374c;color:#d8e4f5}.good{background:#123d34;color:#9fe9d7}.bad{background:#462d35;color:#ffc8d1}a{color:#9bd9ff}hr{border:0;border-top:1px solid #2b374a;margin:24px 0}#notice{min-height:28px;color:#9fe9d7;padding-top:20px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #b9a6ff;outline-offset:4px}.empty{text-align:center;padding:45px 20px}.narrow{max-width:650px}ul{padding-left:22px;line-height:1.8}footer{border-top:1px solid #293345;padding:24px 0;margin-top:36px;font-size:13px;color:#a9b7ca}@media(max-width:680px){.grid{grid-template-columns:1fr}.shell{padding:18px}header{padding:18px}h1{font-size:28px}.card{padding:18px}.bar>label{width:100%}.bar select{width:100%}}
</style></head><body>
<header><div class="brand">Signal<span>Desk</span></div><span class="demo">INTERACTIVE PROTOTYPE · SIMULATED DATA</span></header>
<div class="shell"><div class="bar"><nav aria-label="Main navigation" id="nav"></nav><label>Current project <select id="projects" aria-label="Current project"></select></label></div><div id="notice" role="status" aria-live="polite"></div><main id="main"></main><footer>Design prototype only. No GitHub connection or network requests. No account or sign-in is created. Changes reset when this page reloads. <button id="reset">Reset demo</button></footer></div>
<script>
'use strict';
const pages={overview:'Overview',sources:'Projects & sources',inbox:'Review inbox',tasks:'Follow-ups'};
let projects=[],current='',page='overview',seq=0;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active=()=>projects.find(p=>p.id===current);
function tell(message){$('notice').textContent=message}
function go(next){page=next;render();$('heading')?.focus()}
function button(text,action,cls=''){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function render(){
 const p=active();
 $('nav').innerHTML=Object.entries(pages).map(([id,label])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${label}</button>`).join('');
 $('projects').innerHTML=projects.length?projects.map(p=>`<option value="${p.id}" ${p.id===current?'selected':''}>${esc(p.name)}</option>`).join(''):'<option>No projects yet</option>';
 let html=`<h1 id="heading" tabindex="-1">${page==='detail'?'Review update':pages[page]}</h1>`;
 if(!p){html+='<p class="muted">Turn software releases into decisions for the applications you maintain.</p>'+projectForm();}
 else if(page==='overview'){
 html+=`<p class="muted">Your maintenance desk for ${esc(p.name)}.</p><div class="grid"><div class="card">Needs review<div class="number">${p.review?.state==='New'?1:0}</div></div><div class="card">Open follow-ups<div class="number">${p.task&&p.task.state!=='Done'?1:0}</div></div><div class="card">Source status<p>${esc(p.source?.status||'Not connected')}</p></div></div><div class="card"><h2>${p.review?'Make a decision, keep the context.':'Start monitoring your first repository.'}</h2><p>${p.review?'Read the sample release and decide what it means for this project.':'Connect a public GitHub repository to collect recent stable releases.'}</p>${button(p.review?'Review updates':'Add a source',p.review?'inbox':'sources','primary')}</div>`;
 }else if(page==='sources'){
 html+=`<p class="muted">Public GitHub releases for ${esc(p.name)}. Initial import: up to 30 most recent releases before prerelease filtering; this demo supplies one fictional entry.</p>`;
 if(!p.source)html+='<form id="source-form" class="card narrow"><h2>Add a GitHub repository</h2><label for="repo">Repository · owner/repository</label><input id="repo" name="repo" required pattern="[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+" placeholder="example/sample-library"><p class="muted">Any valid format uses simulated data. No repository is contacted.</p><button class="primary">Connect and collect sample</button></form>';
 else{const s=p.source;html+=`<section class="card"><div class="row"><h2>${esc(s.repo)}</h2><span class="tag ${s.status==='Failed'?'bad':s.status==='Succeeded'?'good':''}">${s.status}</span></div><p>Last successful check: ${esc(s.last||'Never')}</p><p class="muted">${s.status==='Running'?'Collecting sample release…':s.status==='Failed'?'Simulated provider timeout. Existing releases and decisions are preserved.':'Checks are simulated. Production will schedule collection about every six hours, subject to availability and provider limits.'}</p><div class="actions"><button data-action="collect" class="primary" ${s.status==='Running'?'disabled':''}>${s.status==='Failed'?'Retry collection':'Check now'}</button><button data-action="fail" ${s.status==='Running'?'disabled':''}>${s.fail?'Next check will fail':'Simulate failure on next check'}</button></div><hr><h2>Collection history · newest first</h2>${s.runs.length?'<ul>'+s.runs.map(r=>`<li>${esc(r)}</li>`).join('')+'</ul>':'<p>No completed runs yet.</p>'}</section>`}
 html+=projectForm();
 }else if(page==='inbox'){
 html+='<p class="muted">Decisions apply only to the selected project. Reading a release does not resolve it.</p>';
 html+=p.review?`<article class="card"><div class="row"><div><span class="tag">${esc(p.review.state)}</span><h2>Sample Library 2.0 · fictional release</h2><p class="muted">${esc(p.source.repo)} · ${esc(p.name)} · Published 30 September 2026</p></div>${button('Open review','detail','primary')}</div></article>`:`<div class="card empty"><h2>No updates collected</h2><p>Connect a repository or check your source to begin.</p>${button('View sources','sources','primary')}</div>`;
 }else if(page==='detail'&&p.review){const r=p.review;
 html+=`<p class="muted">${esc(p.name)} / ${esc(p.source.repo)}</p><article class="card"><span class="tag">${esc(r.state)}</span><h2>Sample Library 2.0</h2><p><strong>Fictional announcement:</strong> The legacy client method has been removed. Applications using it should migrate to the new client interface.</p><p class="muted">Why it appears: this project follows this repository. SignalDesk has not inspected your code or assessed whether it is affected.</p><p>Published: 30 September 2026 · Retrieved: ${esc(r.fetched)}</p><a href="https://github.com/${esc(p.source.repo)}/releases" target="_blank" rel="noopener noreferrer">Open repository releases ↗</a><p class="muted">The link opens GitHub; this fictional entry has no original release page.</p></article>`;
 if(r.state==='New')html+='<form id="decision-form" class="card narrow"><h2>Record a decision</h2><label for="decision">Decision</label><select id="decision" name="decision"><option>No action</option><option>Action required</option><option>Snooze</option></select><div id="decision-fields"></div><button class="primary">Save decision</button></form>';
 else html+=`<section class="card"><h2>${r.state==='Action open'?'Follow-up created':r.state==='Snoozed'?'Review scheduled for '+esc(r.until):'Decision recorded'}</h2><p>${esc(r.reason||'This review will return when due.')}</p>${r.state==='Action open'?button('View follow-up','tasks','primary'):r.state==='Snoozed'?button('Demo: advance to review date','wake'):button('Reopen review','reopen')}</section>`;
 html+=`<section class="card"><h2>Decision history</h2>${r.history.length?'<ul>'+r.history.map(h=>`<li>${esc(h)}</li>`).join('')+'</ul>':'<p class="muted">No decisions recorded.</p>'}</section>`;
 }else if(page==='tasks'){
 html+='<p class="muted">Track the work resulting from your release reviews.</p>';
 if(!p.task)html+='<div class="card empty"><h2>No follow-ups yet</h2><p>Choose Action required on a release to create one.</p>'+button('Open inbox','inbox','primary')+'</div>';
 else{const t=p.task;html+=`<section class="card narrow"><span class="tag">${esc(t.state)}</span><h2>${esc(t.title)}</h2><p>${esc(p.name)} · Sample Library 2.0</p>${button('Open linked review','detail')}${t.state==='Done'?`<p>Outcome: ${esc(t.outcome)}</p>${button('Reopen follow-up','reopen-task')}`:`<div class="actions">${t.state==='To do'?button('Start work','start'):''}</div><form id="complete-form"><label for="outcome">Completion outcome (required)</label><textarea id="outcome" name="outcome" required placeholder="What changed or what did you verify?"></textarea><button class="primary">Complete follow-up</button></form>`}</section>`}
 }
 $('main').innerHTML=html;
 if($('decision')){fields();$('decision').onchange=fields}
}
function projectForm(){return '<form id="project-form" class="card narrow"><h2>Create a project</h2><label for="project-name">Application name</label><input id="project-name" name="name" required maxlength="80" placeholder="Booking API"><button class="primary">Create project</button></form>'}
function fields(){const d=$('decision').value;$('decision-fields').innerHTML=d==='Snooze'?'<label for="until">Future review date · local midnight (browser timezone)</label><input id="until" name="until" type="date" required>':'<label for="reason">Reason (required)</label><textarea id="reason" name="reason" required></textarea>'+(d==='Action required'?'<label for="title">Follow-up title (required)</label><input id="title" name="title" required maxlength="160">':'')}
function collect(){const p=active(),s=p.source;if(s.status==='Running')return;s.status='Running';render();tell('Simulated collection running.');setTimeout(()=>{const stamp=new Date().toLocaleString(undefined,{timeZoneName:'short'});if(s.fail){s.status='Failed';s.fail=false;s.runs.unshift(stamp+' · Failed: simulated timeout');tell('Simulated collection failed. Retry is available.')}else{s.status='Succeeded';s.last=stamp;const added=!p.review;if(added)p.review={state:'New',fetched:stamp,history:[]};s.runs.unshift(stamp+' · Succeeded: '+(added?'1 initial-history release':'0 new releases; existing entry retained'));tell('Simulated collection succeeded. '+(added?'One release is ready for review.':'No duplicate release was added.'))}render()},800)}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.page){go(el.dataset.page);return}const a=el.dataset.action,p=active();if(pages[a]||a==='detail'){go(a);return}if(a==='collect')collect();if(a==='fail'){p.source.fail=!p.source.fail;render();tell(p.source.fail?'Next simulated collection will fail.':'Failure simulation cleared.')}if(a==='reopen'){p.review.state='New';p.review.history.push('Review reopened');render()}if(a==='wake'){p.review.state='New';p.review.history.push('Demo time advanced; snooze expired');render();tell('Simulated snooze expiry returned this review to New.')}if(a==='start'){p.task.state='In progress';render()}if(a==='reopen-task'){p.task.state='To do';p.review.state='Action open';p.review.history.push('Follow-up reopened');render();tell('Follow-up reopened; review is Action open.')}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,data=new FormData(form),p=active();if(form.id==='project-form'){const name=data.get('name').trim();if(!name){tell('Enter a project name.');return}current=String(++seq);projects.push({id:current,name});go('sources');tell('Project created in this demo. Add a repository next.')}if(form.id==='source-form'){p.source={repo:data.get('repo').trim(),status:'Queued',last:null,runs:[],fail:false};collect()}if(form.id==='decision-form'){const decision=data.get('decision'),r=p.review;if(decision==='Snooze'){const until=data.get('until');const today=new Date();const selected=new Date(until+'T00:00:00');today.setHours(0,0,0,0);if(selected<=today){tell('Choose a review date after today.');$('until').focus();return}r.state='Snoozed';r.until=until;r.reason='Review later';r.history.push('Snoozed until '+until)}else{const reason=data.get('reason').trim(),title=(data.get('title')||'').trim();if(!reason||(decision==='Action required'&&!title)){tell('Enter the required reason and follow-up title.');return}r.reason=reason;r.state=decision==='No action'?'Resolved':'Action open';if(decision==='Action required')p.task={...p.task,title,state:'To do'};r.history.push(decision+': '+reason)}render();tell('Decision saved for '+p.name+'.')}if(form.id==='complete-form'){const outcome=data.get('outcome').trim();if(!outcome){tell('Enter a completion outcome.');return}p.task.outcome=outcome;p.task.state='Done';p.review.state='Resolved';p.review.history.push('Follow-up completed: '+outcome);render();tell('Follow-up completed. Its review is resolved.')}});
$('projects').onchange=e=>{current=e.target.value;go('overview');tell('Project changed. Decisions are separate for each project.')};
$('reset').onclick=()=>{projects=[];current='';page='overview';render();tell('Demo reset.')};render();
</script></body></html>
