log_format signaldesk_safe '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log signaldesk_safe;
    # Error diagnostics may contain upstream query strings, including OAuth codes.
    error_log /dev/null;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
