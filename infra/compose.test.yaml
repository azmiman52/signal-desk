# A separate Compose project with no persistent volumes or production credentials.
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: signaldesk_test
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: signaldesk-test-only
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk_test"]
      interval: 2s
      timeout: 3s
      retries: 20
